[project]
name = "atlas-platform-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "Django>=6.0",
    "djangorestframework>=3.17",
    "djangorestframework-gis>=1.2",
    "django-cors-headers>=4.9",
    "django-debug-toolbar>=6.3",
    "django-filter>=25.2",
    "django-money>=3.6",
    "django-stubs>=6.0",
    "django-stubs-ext>=6.0",
    # ASGI / WebSocket
    "asgiref>=3.11",
    "daphne>=4.2",
    "channels>=4.3",
    "channels-redis>=4.3",
    "uvicorn>=0.49",
    "gunicorn>=26.0",
    "whitenoise>=6.12",
    # Database / cache / queue
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "redis[hiredis]>=8.0",
    "celery>=5.6",
    # GIS
    "rasterio>=1.5",
    "rio-cogeo>=7.0",
    "rio-tiler>=9.2",
    "shapely>=2.1",
    "pyproj>=3.7",
    "geopy>=2.4",
    "mercantile>=1.2",
    # AI / LangChain
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-openai>=1.3",
    "langchain-ollama>=1.1",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langgraph-prebuilt>=1.1",
    "langsmith>=0.8",
    "openai>=2.42",
    "ollama>=0.6",
    # Storage
    "boto3>=1.43",
    "minio>=7.2",
    # Auth / security
    "PyJWT>=2.13",
    "cryptography>=49.0",
    # Data / ML
    "numpy>=2.4",
    "scipy>=1.17",
    "matplotlib>=3.11",
    "pillow>=12.2",
    "fastai>=2.7",
    # HTTP / API clients
    "requests>=2.34",
    "httpx>=0.28",
    "pydantic>=2.13",
    # Utilities
    "PyYAML>=6.0",
    "pytz>=2026.2",
    "tzlocal>=5.4",
    "Markdown>=3.10",
    "language-tool-python>=3.4",
    "python-json-logger>=4.1",
    # Dev / lint tools
    "black>=26.5",
    "isort>=8.0",
    "pylint>=4.0",
    "pre-commit>=4.6",
    "pyflakes>=3.4",
    "autoflake>=2.3",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
skip_glob = ["k8s/*"]

[tool.ruff]
line-length = 88
lint.ignore = ["F841"]
exclude = ["*.yaml"]
fix = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401","F403"]

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "backend_projects.settings"

[tool.pylint.messages_control]
disable = ["missing-module-docstring","missing-class-docstring","too-many-ancestors"]
